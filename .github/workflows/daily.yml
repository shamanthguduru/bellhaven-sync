name: bellhaven-sync-daily

on:
  schedule:
    - cron: "0 11 * * *"   # every day at 11:00 UTC (6:00 AM US Eastern)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Restore proposal history
        uses: actions/cache@v4
        with:
          path: data/proposals.db
          key: proposals-db-${{ github.run_id }}
          restore-keys: proposals-db-
      - name: Run pipeline (proposals only, nothing writes without approval)
        env:
          CRM_TOKEN: ${{ secrets.CRM_TOKEN }}
          CRM_BASE: ${{ secrets.CRM_BASE }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          mkdir -p data
          python -m src.run_pipeline